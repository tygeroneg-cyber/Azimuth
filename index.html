<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark" id="csMeta">
<meta name="theme-color" content="#000000" id="tcMeta">
<script>
/* temă: auto (după telefon), luminoasă sau întunecată; aplicată înainte de afișare, ca să nu clipească */
(function(){
  var pref = "auto";
  try { var v = localStorage.getItem("az-theme"); if (v === "light" || v === "dark" || v === "auto") pref = v; } catch(e) {}
  var mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
  function apply(){
    var dark = pref === "dark" || (pref === "auto" && !!(mq && mq.matches));
    var r = document.documentElement;
    r.setAttribute("data-theme", dark ? "dark" : "light");
    r.style.colorScheme = dark ? "dark" : "light";
    /* „only” oprește întunecarea forțată a browserului, care spăla culorile */
    var cs = document.getElementById("csMeta"); if (cs) cs.content = dark ? "only dark" : "only light";
    var tc = document.getElementById("tcMeta"); if (tc) tc.content = dark ? "#000000" : "#F5F5F7";
    return dark;
  }
  window.AZ_THEME = {
    get pref(){ return pref; },
    set: function(p){ pref = p; try { localStorage.setItem("az-theme", p); } catch(e) {} return apply(); },
    apply: apply,
    onSystemChange: null
  };
  apply();
  if (mq) { var h = function(){ if (pref === "auto") { apply(); if (window.AZ_THEME.onSystemChange) window.AZ_THEME.onSystemChange(); } };
    if (mq.addEventListener) mq.addEventListener("change", h); else if (mq.addListener) mq.addListener(h); }
})();
</script>
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>Azimuth</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: o singură coloană de lectură (max 760px), antet fix cu data, carduri de știri cu bulină de impact și steaguri în colț. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#12161C; --muted:#5A6473; --line:#DCE1E8; --accent:#2445D6;
  --soft:#F4F6F9; --none:#C9CFD8; --none-ink:#8A93A1;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --radius:14px; --shadow:0 1px 2px rgba(18,22,28,.05), 0 4px 16px rgba(18,22,28,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E13; --surface:#141922; --ink:#E8ECF2; --muted:#8E98A8; --line:#262D39; --accent:#8299FF;
    --soft:#1A202B; --none:#2A313D; --none-ink:#5F6878; --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E13; --surface:#141922; --ink:#E8ECF2; --muted:#8E98A8; --line:#262D39; --accent:#8299FF;
  --soft:#1A202B; --none:#2A313D; --none-ink:#5F6878; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
button, a, input{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.iconbtn, .datebtn, .save-btn, .more-btn{position:relative}
.iconbtn::after, .datebtn::after, .save-btn::after, .more-btn::after{content:""; position:absolute; inset:-5px}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:16px/1.55 var(--body); -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.wrap{max-width:760px; margin:0 auto; padding:0 max(16px, env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left))}

/* Antet */
header.top{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) and (background:color-mix(in srgb, red 50%, blue)) {
  header.top{background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px)}
}
.top-in{max-width:760px; margin:0 auto; padding:10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); display:flex; align-items:center; gap:10px}
.brand{display:flex; align-items:center; gap:9px; margin-right:auto; padding:4px 6px 4px 0; border:0; background:none; color:var(--ink); font:700 22px/1 var(--display); letter-spacing:-.01em; white-space:nowrap; border-radius:10px}
.brand svg{width:32px; height:32px; flex:none; border-radius:8px; filter:drop-shadow(0 1px 2px rgba(10,15,31,.25)); transition:transform .6s cubic-bezier(.22,1,.36,1)}
@media (hover:hover){ .brand:hover .needle{transform:rotate(-25deg)} }
.brand .needle{transform-origin:50px 50px; transform-box:view-box; transition:transform .7s cubic-bezier(.22,1,.36,1)}
.brand.spin .needle{transform:rotate(360deg)}
.iconbtn{display:inline-grid; place-items:center; width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--surface)}
.iconbtn:disabled{opacity:.35; cursor:default}
.iconbtn svg{width:18px; height:18px}
.datebtn{display:flex; align-items:center; gap:8px; height:38px; padding:0 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-weight:600; font-size:14px; white-space:nowrap}
.datebtn .dot{width:10px; height:10px}

/* Bulina de impact */
.dot{display:inline-block; width:12px; height:12px; border-radius:50%; flex:none; box-shadow:0 0 0 3px color-mix(in srgb, currentColor 18%, transparent)}

/* Ziua */
.day{margin-top:20px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow)}
.day-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap}
.eyebrow{font:500 12px/1.2 var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.day h1{font:700 32px/1.1 var(--display); margin:4px 0 0; text-wrap:balance; overflow-wrap:anywhere}
.impact-chip{display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; font-weight:600; font-size:14px; border:1px solid var(--line); background:var(--soft)}
.impact-chip .dot{width:10px;height:10px}
.rank-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:20px 0 8px}
.rank{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.rank button{width:100%; display:grid; grid-template-columns:auto 1fr auto; gap:4px 12px; align-items:center; text-align:left; background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:10px 12px; transition:border-color .2s, transform .2s}
@media (hover:hover){ .rank button:hover{border-color:var(--muted)} }
.rank button:active{transform:scale(.99)}
.rank .rn{font:500 12px/1 var(--mono); color:var(--muted); grid-row:span 2}
.rank .rt{font-size:14px; font-weight:600; line-height:1.3; min-width:0; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; overflow-wrap:anywhere}
.rank .rs{font:500 13px/1 var(--mono); grid-row:span 2; font-variant-numeric:tabular-nums}
.rank .track{height:6px; border-radius:999px; background:var(--line); overflow:hidden}
.rank .fill{height:100%; border-radius:999px}
.scale{display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12px; color:var(--muted)}
.scale i{flex:1; height:6px; border-radius:999px; max-width:160px}
.card{scroll-margin-top:72px}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent)} 20%{box-shadow:0 0 0 3px var(--accent)} 100%{box-shadow:0 0 0 0 transparent}}
.card.flash{animation:flash 1.8s ease}
.strip-note{font-size:13px; color:var(--muted)}
.brief{margin:14px 0 0; padding:0; list-style:none; display:grid; gap:8px}
.brief li{padding-left:18px; position:relative}
.brief li::before{content:""; position:absolute; left:2px; top:.62em; width:7px; height:7px; border-radius:2px; background:var(--accent)}

/* Filtre */
.seg{position:relative; display:flex; gap:2px; padding:4px; margin:20px 0 8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; overflow-x:auto; scrollbar-width:none; box-shadow:var(--shadow)}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative; z-index:1; flex:none; height:40px; padding:0 16px; border:0; background:transparent; border-radius:999px; font-size:14px; font-weight:600; color:var(--muted); transition:color .35s ease}
@media (hover:hover){ .seg button:not([aria-checked="true"]):hover{color:var(--ink)} }
.seg button[aria-checked="true"]{color:var(--bg)}
.seg-ind{position:absolute; z-index:0; top:4px; left:0; height:40px; width:0; border-radius:999px; background:var(--ink); transition:transform .5s cubic-bezier(.22,1,.36,1), width .5s cubic-bezier(.22,1,.36,1)}
.count-line{font-size:13px; color:var(--muted); margin:0 6px 12px; transition:opacity .25s}
@keyframes cardIn{from{opacity:0; transform:translateY(16px) scale(.985)} to{opacity:1; transform:none}}
.stories{transition:opacity .2s ease, transform .2s ease}
.stories.leave{opacity:0; transform:translateY(8px)}
.stories.enter > *{animation:cardIn .55s cubic-bezier(.22,1,.36,1) both; animation-delay:calc(var(--i, 0) * 50ms)}
.count{font-size:13px; color:var(--muted); margin-left:auto}

/* Card știre */
.stories{display:grid; gap:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
.card-head{display:grid; grid-template-columns:1fr auto; gap:12px; padding:16px 16px 0}
.title-row{display:flex; align-items:flex-start; gap:10px}
.title-row .dot{margin-top:9px}
.card h2{font:600 21px/1.25 var(--display); margin:0; text-wrap:balance; overflow-wrap:anywhere; hyphens:auto}
.num{font:500 12px/1 var(--mono); color:var(--muted); margin-bottom:6px; display:block}
.flags{display:flex; flex-wrap:wrap; justify-content:flex-end; align-content:flex-start; gap:4px; max-width:112px}
.flag{width:26px; height:18px; border-radius:3px; overflow:hidden; box-shadow:0 0 0 1px var(--line); display:block; background:var(--soft)}
.flag svg{width:100%; height:100%; display:block}
.flag.more{display:grid; place-items:center; font:500 10px/1 var(--mono); color:var(--muted)}
.meta{display:flex; flex-wrap:wrap; gap:6px; padding:10px 16px 0}
.tag{font-size:12px; font-weight:600; padding:3px 9px; border-radius:6px; background:var(--soft); color:var(--muted); border:1px solid var(--line)}
.tag.cat-geo{color:#7A3FD1; background:var(--soft); background:color-mix(in srgb,#7A3FD1 10%, var(--surface)); border-color:var(--line); border-color:color-mix(in srgb,#7A3FD1 25%, var(--surface))}
.tag.cat-eco{color:#0E7C66; background:var(--soft); background:color-mix(in srgb,#0E7C66 10%, var(--surface)); border-color:var(--line); border-color:color-mix(in srgb,#0E7C66 25%, var(--surface))}
.tag.cat-alt{color:#B4540F; background:var(--soft); background:color-mix(in srgb,#B4540F 10%, var(--surface)); border-color:var(--line); border-color:color-mix(in srgb,#B4540F 25%, var(--surface))}
:root[data-theme="dark"] .tag.cat-geo{color:#B99BFF} :root[data-theme="dark"] .tag.cat-eco{color:#5FD3B6} :root[data-theme="dark"] .tag.cat-alt{color:#F2A35E}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag.cat-geo{color:#C4A8FF} :root:not([data-theme="light"]) .tag.cat-eco{color:#4BE3BD} :root:not([data-theme="light"]) .tag.cat-alt{color:#FFAA5C} }
.tag.night{color:var(--ink)}
.tag.warn{color:#B42318; border-color:var(--line); border-color:color-mix(in srgb,#B42318 35%, var(--surface))}
.essential{padding:12px 16px 0; margin:0; font-size:16px; overflow-wrap:anywhere}
.card-actions{display:flex; gap:8px; padding:14px 16px 16px; align-items:center}
.more-btn{display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 14px; border-radius:10px; border:1px solid var(--line); background:var(--soft); font-size:14px; font-weight:600}
.more-btn svg{width:14px;height:14px; transition:transform .45s cubic-bezier(.22,1,.36,1)}
.card.open .more-btn svg{transform:rotate(180deg)}
.save-btn{margin-left:auto; width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center}
.save-btn svg{width:16px;height:16px}
.save-btn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
/* Detalii: înălțime animată (grid 0fr -> 1fr) + cascadă pe rânduri */
.details{display:grid; grid-template-rows:0fr; transition:grid-template-rows .5s cubic-bezier(.22,1,.36,1)}
.card.open .details{grid-template-rows:1fr}
.details-in{min-height:0; overflow:hidden}
.dz{border-top:1px solid var(--line); padding:4px 16px 16px; background:var(--soft); opacity:0; transition:opacity .3s ease}
.card.open .dz{opacity:1; transition-duration:.15s}
.card.open .dz .cas{animation:cascadeIn .55s cubic-bezier(.22,1,.36,1) both; animation-delay:calc(var(--k, 0) * 38ms + 70ms)}
@keyframes cascadeIn{from{opacity:0; transform:translate3d(0,-10px,0)} to{opacity:1; transform:none}}
.card.closing .dz .cas{animation:cascadeOut .24s cubic-bezier(.4,0,1,1) both; animation-delay:calc((var(--n, 0) - var(--k, 0)) * 20ms)}
@keyframes cascadeOut{from{opacity:1; transform:none} to{opacity:0; transform:translate3d(0,-8px,0)}}
.card.static .details, .card.static .dz, .card.static .more-btn svg{transition:none}
.card.static .dz .cas{animation:none}
.dz h3, .srcpanel h3{font:500 12px/1 var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:16px 0 8px}
.dz ul, .srcpanel ul{margin:0; padding-left:18px; display:grid; gap:6px}
.dz .src a, .srcpanel .src a{word-break:break-word}
.srcpanel{padding:4px 16px 16px}
.src .sec{font-size:12px; color:var(--muted)}

/* Secțiuni */
.section{margin-top:28px}
.section h2.sh{font:700 24px/1.2 var(--display); margin:0 0 12px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
.tablewrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums}
th,td{text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap}
th{font:500 11px/1 var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); background:var(--soft)}
tr:last-child td{border-bottom:0}
.up{color:#0E8A4A} .down{color:#C4291C}
.mk-group{font:500 11px/1 var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); background:var(--soft); padding:10px 14px; border-bottom:1px solid var(--line)}
.mk{list-style:none; margin:0; padding:0}
.mk li{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line)}
.mk-l{min-width:0; display:grid; gap:2px}
.mk-l b{font-weight:600; font-size:15px; overflow-wrap:anywhere}
.mk-l span{font-size:12px; color:var(--muted)}
.mk-r{display:grid; justify-items:end; gap:4px; text-align:right; flex:none; max-width:58%}
.mk-c.big{font-size:15px; padding:4px 10px}
.mk-lvl{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.mk-note{margin:0; padding:10px 14px; font-size:13px; line-height:1.45; color:var(--muted); border-bottom:1px solid var(--line)}
.mk-v{font-weight:600; font-size:16px; font-variant-numeric:tabular-nums}
.mk-v small{font-weight:500; font-size:12px; color:var(--muted)}
.mk-c{font-size:13px; font-weight:600; padding:2px 8px; border-radius:999px; font-variant-numeric:tabular-nums; background:var(--soft); color:var(--muted)}
.mk-c.up{color:#0E8A4A; background:var(--soft); background:color-mix(in srgb,#0E8A4A 14%, var(--surface))}
.mk-c.down{color:#C4291C; background:var(--soft); background:color-mix(in srgb,#C4291C 14%, var(--surface))}
:root[data-theme="dark"] .mk-c.up{color:#32E875} :root[data-theme="dark"] .mk-c.down{color:#FF6B6B}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .mk-c.up{color:#32E875} :root:not([data-theme="light"]) .mk-c.down{color:#FF6B6B} }
.jump{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:14px 2px 2px; margin:0 -2px; scroll-snap-type:x proximity; overscroll-behavior-x:contain}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none; scroll-snap-align:start; display:inline-flex; align-items:center; gap:8px; min-height:42px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); font-size:14px; font-weight:600; color:var(--ink); transition:transform .2s cubic-bezier(.22,1,.36,1), border-color .2s}
.jump button:active{transform:scale(.96)}
@media (hover:hover){ .jump button:hover{border-color:var(--muted)} }
.jump svg{width:16px; height:16px; color:var(--muted); flex:none}
.jump .n{font:500 12px/1 var(--mono); color:var(--muted); font-variant-numeric:tabular-nums}
.jump .dot{width:8px; height:8px}
.section, #sec-stories{scroll-margin-top:72px}
@keyframes secFlash{0%{box-shadow:0 0 0 0 transparent} 25%{box-shadow:0 0 0 3px var(--accent)} 100%{box-shadow:0 0 0 0 transparent}}
.sec-flash{animation:secFlash 1.4s ease}
.fx-sub{margin:-6px 0 12px; color:var(--muted); font-size:14px}
.fx-list{display:grid; gap:12px}
.fx-top{display:flex; align-items:center; gap:8px; padding:14px 16px 0; font:500 12px/1 var(--mono); letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
.fx-top .dot{width:10px; height:10px}
.fx-top .lvl{font-weight:600}
.fx-top .ref{margin-left:auto}
.fx h3.fx-t{font:600 19px/1.25 var(--display); margin:8px 16px 0; text-wrap:balance; overflow-wrap:anywhere}
.fx-sum{margin:8px 16px 0; font-size:15px; overflow-wrap:anywhere}
.fx-bar{margin:12px 16px 0; height:6px; border-radius:999px; background:var(--line); overflow:hidden}
.fx-bar i{display:block; height:100%; width:0; border-radius:999px; transition:width .9s cubic-bezier(.22,1,.36,1); transition-delay:calc(var(--i, 0) * 90ms)}
.fx-list.seen .fx-bar i{width:var(--w)}
.fx-chips{display:flex; flex-wrap:wrap; gap:6px; padding:12px 16px 0}
.fx-chip{display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:600; padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:var(--soft); color:var(--ink)}
.fx-chip .ar{font-size:10px}
.fx-chip .v{font-weight:500; color:var(--muted); font-variant-numeric:tabular-nums}
.fx-chip.up .ar{color:#0E8A4A} .fx-chip.down .ar{color:#C4291C} .fx-chip.flat .ar{color:var(--muted)}
:root[data-theme="dark"] .fx-chip.up .ar{color:#32E875} :root[data-theme="dark"] .fx-chip.down .ar{color:#FF6B6B}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .fx-chip.up .ar{color:#32E875} :root:not([data-theme="light"]) .fx-chip.down .ar{color:#FF6B6B} }
.fx-go{margin-left:auto; display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-size:14px; font-weight:600}
.fx-go svg{width:14px; height:14px}
.fx-disc{margin:12px 2px 0; font-size:12px; color:var(--muted)}
.panel-note{padding:12px 14px; font-size:14px; color:var(--muted); border-top:1px solid var(--line)}
.watch{list-style:none; margin:0; padding:0}
.watch li{padding:12px 14px; border-bottom:1px solid var(--line)}
.watch li:last-child{border-bottom:0}
.watch b{display:block}
.watch span{color:var(--muted); font-size:14px}

/* Calendar */
.overlay{position:fixed; inset:0; z-index:50; background:rgba(8,10,14,.45); display:none; align-items:flex-end; justify-content:center}
.overlay.show{display:flex}
@media (min-width:640px){ .overlay{align-items:center} }

.cal{display:flex; flex-direction:column; gap:8px}
.cal .cd{display:flex; align-items:center; gap:12px; width:100%; min-height:64px; padding:10px 12px; border:0; border-radius:16px; background:var(--soft); color:var(--ink); text-align:left; opacity:0; transform:translate3d(0,8px,0); animation:cdIn .38s cubic-bezier(.22,1,.36,1) forwards}
.cal .cd:nth-child(2){animation-delay:.03s} .cal .cd:nth-child(3){animation-delay:.06s} .cal .cd:nth-child(4){animation-delay:.09s} .cal .cd:nth-child(5){animation-delay:.12s} .cal .cd:nth-child(6){animation-delay:.15s} .cal .cd:nth-child(7){animation-delay:.18s} .cal .cd:nth-child(8){animation-delay:.21s}
@keyframes cdIn{to{opacity:1; transform:none}}
.cal button.cd{cursor:pointer; transition:transform .15s ease, box-shadow .2s ease}
.cal button.cd:active{transform:scale(.98)}
@media (hover:hover){ .cal button.cd:hover{box-shadow:inset 0 0 0 1px var(--line)} }
.cd-date{flex:none; width:46px; height:46px; border-radius:13px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--c, var(--none)); color:#fff; line-height:1}
.cd-date b{font:700 18px/1 var(--display); font-variant-numeric:tabular-nums} .cd-date small{font-size:10.5px; font-weight:600; margin-top:3px; text-transform:uppercase; letter-spacing:.02em; opacity:.92}
.cd-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
.cd-top{font-size:12px; font-weight:600; color:var(--muted)}
.cd-title{font-size:14.5px; font-weight:600; line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.cd-score{flex:none; min-width:30px; text-align:right; font:700 17px/1 var(--display); color:var(--c, var(--muted)); font-variant-numeric:tabular-nums}
.cal .cd.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .cd.empty .cd-date{background:var(--none); color:var(--none-ink)} .cal .cd.empty .cd-title{color:var(--muted); font-weight:500}
.cal .cd.future{background:transparent; box-shadow:inset 0 0 0 1.5px var(--line); border-style:dashed; opacity:0; color:var(--muted)}
.cal .cd.future .cd-date{background:var(--none); color:var(--none-ink)} .cal .cd.future .cd-title{font-weight:500; color:var(--muted)}
.cal .cd.future{animation-name:cdInDim} @keyframes cdInDim{to{opacity:.7; transform:none}}
#calOv .legend .none{display:none}
@media (prefers-reduced-motion: reduce){ .cal .cd{animation:none; opacity:1; transform:none} .cal .cd.future{opacity:.7} }
#calTitle{text-transform:none}

/* --- știri compacte, continuări, România, ediție întârziată --- */
.more-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:10px 4px 2px}
.more-head b{font:700 20px/1.2 var(--display); letter-spacing:-.01em; color:var(--ink)}
.more-head span{font-size:13px; color:var(--muted)}
.card.compact{box-shadow:none}
.c-head{display:flex; align-items:center; gap:10px; width:100%; min-height:60px; padding:12px 14px; border:0; background:none; color:inherit; text-align:left; font:inherit; cursor:pointer}
.c-head .dot{flex:none; margin:0}
.c-num{flex:none; width:20px; font:500 12px/1 var(--mono); color:var(--muted)}
.c-main{flex:1; min-width:0; display:grid; gap:3px}
.c-title{font-weight:600; font-size:15.5px; line-height:1.3; color:var(--ink); overflow-wrap:anywhere}
.c-meta{font-size:12.5px; color:var(--muted); line-height:1.3}
.c-fu{display:inline-block; margin-right:6px; padding:1px 6px; border-radius:6px; background:var(--soft); border:1px solid var(--line); color:var(--accent); font-weight:600; font-size:11.5px}
.c-score{flex:none; font:700 15px/1 var(--mono)}
.c-chev{flex:none; width:16px; height:16px; color:var(--muted)}
.c-chev svg{width:16px; height:16px; display:block; transition:transform .45s cubic-bezier(.22,1,.36,1)}
.card.compact.open .c-chev svg{transform:rotate(180deg)}
.card.compact .dz{padding:0 16px 16px}
.card.compact .dz .essential{padding:0; margin:0 0 4px}
.card.compact .c-flags{max-width:none; justify-content:flex-start; gap:8px; margin:14px 0 12px}
.card.compact .c-flags .flag{width:28px; height:20px; border-radius:4px; flex:none}
.card.compact .dz h3:first-of-type{margin-top:12px}
.since{margin:12px 16px 0; padding:10px 12px; border-radius:10px; background:var(--soft); border:1px solid var(--line); font-size:14.5px; line-height:1.45; color:var(--ink)}
.since b{display:block; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--accent); margin-bottom:3px}
.card.compact .since{margin:10px 0 0}
.tag.fu{color:var(--accent); border-color:color-mix(in srgb, var(--accent) 35%, var(--line)); background:color-mix(in srgb, var(--accent) 9%, var(--surface))}
.ro-card{margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; scroll-margin-top:72px}
.ro-h{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.ro-h b{font:700 18px/1.2 var(--display); letter-spacing:-.01em}
.ro-flag .flag{width:24px; height:17px; display:block}
.ro-card ul{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.ro-card li{display:grid; gap:2px; padding-top:10px; border-top:1px solid var(--line)}
.ro-card li:first-child{border-top:0; padding-top:0}
.ro-card li b{font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
.ro-card li span{font-size:15.5px; line-height:1.45}
.stale{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:0 0 12px; padding:12px 14px; border-radius:12px; background:var(--soft); border:1px solid var(--line); font-size:14.5px; line-height:1.4}
.stale span{flex:1; min-width:180px}
.stale.warn{border-color:color-mix(in srgb, #D98A00 45%, var(--line)); background:color-mix(in srgb, #F2A900 12%, var(--surface))}
.stale button{min-height:36px; padding:0 14px; border-radius:999px; border:0; background:var(--accent); color:#fff; font-weight:600; font-size:14px}
.clist{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
.clist .card.compact{border:0; border-radius:0; box-shadow:none; background:none; border-top:1px solid var(--line)}
.clist .card.compact:first-child{border-top:0}
.clist .card.compact.open{background:color-mix(in srgb, var(--soft) 55%, var(--surface))}
.layout .ro-card{order:2}
@media (min-width:900px){ .c-head{padding:14px 18px; min-height:64px} .card.compact .dz{padding:0 22px 20px} .c-title{font-size:16px} }
</style>

function isDark(){
  const th = document.documentElement.getAttribute("data-theme");

function impactColor(v){
  const x = Math.min(10, Math.max(1, Number(v) || 1));
  const t = (x - 1) / 9, mid = 1 - Math.abs(t - .5) * 2;
  const hue = t <= .5 ? 135 - 85 * (t / .5) : 50 - 50 * ((t - .5) / .5);
  /* pe fundal închis culorile au nevoie de mai multă lumină și saturație ca să nu pară șterse */
  const dark = isDark();
  /* pe fundal deschis galbenul/portocaliul are nevoie de mai puțină lumină ca să rămână lizibil */
  const light = dark ? 54 + 8 * mid : 43 - 9 * mid;
  const sat = dark ? 92 + 6 * mid : 88 + 8 * mid;
  return "hsl("+hue.toFixed(1)+" "+sat.toFixed(0)+"% "+light.toFixed(0)+"%)";
}

function roNow(){
  try {
    const p = new Intl.DateTimeFormat("en-CA", {timeZone:"Europe/Bucharest", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false}).formatToParts(new Date());
    const g = k => (p.find(x => x.type === k) || {}).value;
    return {iso: g("year")+"-"+g("month")+"-"+g("day"), min: (Number(g("hour")) % 24) * 60 + Number(g("minute"))};
  } catch(e) { const d = new Date(); return {iso: iso(d), min: d.getHours()*60 + d.getMinutes()}; }
}
function staleHtml(date){
  const last = latestDay(); if (!last || date !== last) return "";
  const now = roNow(); if (last >= now.iso) return "";
  const y = new Date(parseDate(now.iso)); y.setDate(y.getDate() - 1);
  const ld = fmt(parseDate(last), {day:"numeric", month:"long"});
  let msg, cls = "stale";
  if (last < iso(y)) { msg = t("staleOld")(ld); cls += " warn"; }
  else if (now.min < 8*60 + 45) return "";
  else if (now.min < 9*60 + 15) msg = t("staleSoon");
  else { msg = t("staleLate")(ld); cls += " warn"; }
  return '<div class="'+cls+'" role="status"><span>'+esc(msg)+'</span><button type="button" data-act="recheck">'+esc(t("checkAgain"))+'</button></div>';
}

function srcNames(s){
  const out = [];
  arr(s.sources).forEach(x => { const tt = String(x.title || ""); out.push(tt.toLowerCase());
    const head = tt.split(/\s+[–—-]\s+|\s*\(/)[0].trim();

const ATTR_LEAD = /^(prin|via|potrivit|according to|citat de|cited by|quoted by)\s+/i;
function isAttr(inner, names){
  const c = inner.trim();
  if (!c || c.length > 90 || /[„“"«:;!?%]/.test(c)) return false;
  const parts = c.split(/\s*,\s*|\s+(?:și|and|&)\s+|\s+(?:prin|via)\s+/).map(x => x.replace(ATTR_LEAD, "").trim()).filter(Boolean);
  if (!parts.length) return false;
  return parts.every(p => {
    const lp = p.toLowerCase();
    if (names.some(n => n.includes(lp))) return true;
    if (/\d/.test(p)) return false;
    const w = p.split(/\s+/);
    if (w.length > 5) return false;
    if (/^[A-ZĂÂÎȘŞȚŢ0-9.&-]{2,6}$/.test(p)) return false; /* acronim care nu e printre surse: probabil o abreviere, nu o sursă */
    return w.every(x => /^[A-ZĂÂÎȘŞȚŢ]/.test(x) || /^(de|of|the|la|din|al|al-|el)$/i.test(x));
  });
}
function stripAttr(text, names){
  let t = String(text ?? "");
  t = t.replace(/\s*\(([^()]*)\)/g, (m, inner) => isAttr(inner, names) ? "" : m);
  return t.replace(/\s+([.,;:])/g, "$1").replace(/\s{2,}/g, " ").trim();
}

function moveIndicator(smooth){

const hasVal = v => !!String(v ?? "").trim() && !/^[-−–—]$/.test(String(v).trim());
function mkGroup(name){
  if (!/\//.test(String(name)) && !/\((NBR|BNR)\)/.test(String(name)) && /\([A-Z0-9.]{1,7}\)\s*$/.test(String(name))) return 3;
  const n = String(name).toLowerCase();
  if (/\b[a-z]{3}\/[a-z]{3}\b/.test(n) || /curs|dolar|dollar|euro\b|leu|yen/.test(n)) return 1;
  if (/brent|wti|petrol|oil|aur|gold|argint|silver|gaz|gas|bitcoin|btc|ether|cupru|copper/.test(n)) return 2;
  return 0;
}
function mkUnit(name, value){
  const v = String(value);
  if (/[a-zA-Z$€£%]/.test(v.replace(/^(circa|aprox\.?|aproximativ|peste|sub|puțin sub|puțin peste|aproape)\s+/i, ""))) return "";
  if (!/\d/.test(v)) return "";
  const n = String(name).toLowerCase();
  const fx = n.match(/\b([a-z]{3})\/([a-z]{3})\b/);
  const U = t("units");
  if (fx) return fx[2] === "ron" ? U.ron : fx[2].toUpperCase();
  if (/brent|wti|petrol|oil/.test(n)) return U.oil;
  if (/aur|gold|argint|silver/.test(n)) return U.gold;
  if (/bitcoin|btc|ether/.test(n)) return U.usd;
  if (/gaz|gas/.test(n)) return U.gas;
  return U.points;
}
function mkIdx(m){
  const ch = hasVal(m.change) ? String(m.change).trim() : "";
  const dir = /[-−–]\s*\d/.test(ch) ? "down" : /\+\s*\d/.test(ch) ? "up" : "flat";
  const arrow = dir === "up" ? "▲ " : dir === "down" ? "▼ " : "";
  const lvl = hasVal(m.value) ? String(m.value).trim().replace(/\s*(points?|puncte|pct\.?)\s*$/i, "") : "";
  return '<li><div class="mk-l"><b>'+esc(m.name)+'</b>'+(m.when ? '<span>'+esc(m.when)+'</span>' : '')+'</div>'+
    '<div class="mk-r">'+(ch ? '<span class="mk-c big '+dir+'">'+arrow+esc(ch)+'</span>' : '')+
    (lvl ? '<span class="mk-lvl">'+esc(t("idxLevel"))+' '+esc(lvl)+'</span>' : '')+'</div></li>';
}
function mkRow(m){
  const ch = hasVal(m.change) ? String(m.change).trim() : "";
  const dir = /[-−–]\s*\d/.test(ch) ? "down" : /\+\s*\d/.test(ch) ? "up" : "flat";
  const arrow = dir === "up" ? "▲ " : dir === "down" ? "▼ " : "";
  let val = hasVal(m.value) ? String(m.value).trim() : "";
  let unit = val ? mkUnit(m.name, val) : "";
  const sp = val.match(/^([\d.,]+)\s+(\S.*)$/);
  if (sp && !unit) { val = sp[1]; unit = sp[2]; }
  return '<li><div class="mk-l"><b>'+esc(m.name)+'</b>'+(m.when ? '<span>'+esc(m.when)+'</span>' : '')+'</div>'+
    '<div class="mk-r">'+(val ? '<span class="mk-v">'+esc(val)+(unit ? ' <small>'+esc(unit)+'</small>' : '')+'</span>' : '')+
    (ch ? '<span class="mk-c '+dir+'">'+arrow+esc(ch.replace(/^[+]/, "+"))+'</span>' : '')+'</div></li>';
}

    (x.n ? '<button class="fx-go" data-jump="'+esc(x.n)+'">'+esc(t("fxOpen"))+'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg></button>' : '')+

let fxObs = null;
function watchFx(){
  const el = $("#fxList"); if (!el) return;
  if (fxObs) fxObs.disconnect();
  if (!("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) { el.classList.add("seen"); return; }
  fxObs = new IntersectionObserver(es => { es.forEach(e => { if (e.isIntersecting) { el.classList.add("seen"); fxObs.disconnect(); } }); }, {threshold: 0.12});
  fxObs.observe(el);
}

/* ---------- frică și lăcomie ---------- */
const fgNum = v => (typeof v === "number" && isFinite(v)) ? Math.max(0, Math.min(100, v)) : null;
function fgOf(date){ const d = S.days[date], f = d && d.fg; if (!f) return null; const o = {s: fgNum(f.s), c: fgNum(f.c)}; return (o.s === null && o.c === null) ? null : o; }
function fgMain(date){ const f = fgOf(date); return f ? (f.s !== null ? f.s : f.c) : 50; }
const fgColor = v => impactColor(10 - (v / 100) * 9);
const fgWord = v => { const w = t("fgWords"); return v < 25 ? w[0] : v < 45 ? w[1] : v <= 55 ? w[2] : v <= 75 ? w[3] : w[4]; };
function fgSection(date){
  const cur = fgOf(date); if (!cur) return "";
  const grad = "linear-gradient(90deg,"+[0,25,50,75,100].map(fgColor).join(",")+")";
  const row = (name, src, v) => v === null ? "" :
    '<div class="fg-row"><div class="fg-top"><div><b>'+esc(name)+'</b><small>'+esc(src)+'</small></div>'+
    '<div class="fg-val" style="color:'+fgColor(v)+'"><b>'+v+'</b><span>'+esc(fgWord(v))+'</span></div></div>'+
    '<div class="fg-bar" style="background:'+grad+'" role="img" aria-label="'+esc(name+": "+v+"/100, "+fgWord(v))+'"><i style="left:'+v+'%"></i></div>'+
    '<div class="fg-ends"><span>0</span><span>50</span><span>100</span></div></div>';
  const dates = Object.keys(S.days).filter(d => d <= date && fgOf(d)).sort().slice(-14);
  let chart = "";
  if (dates.length > 1) {
    const W = 320, H = 150, L = 26, R = 10, T = 10, B = 24, n = dates.length;
    const x = i => L + (W - L - R) * (n === 1 ? .5 : i / (n - 1)), y = v => T + (H - T - B) * (1 - v / 100);
    const line = (k, cls) => {
      const pts = dates.map((d, i) => { const v = fgOf(d)[k]; return v === null ? null : [x(i), y(v), v]; }).filter(Boolean);
      if (!pts.length) return "";
      return (pts.length > 1 ? '<polyline class="'+cls+'" fill="none" points="'+pts.map(p => p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'"/>' : "")+
        pts.map(p => '<circle class="'+cls+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.2"/>').join("");
    };
    const short = d => { const p = d.split("-"); return Number(p[2])+"."+Number(p[1]); };
    const step = Math.ceil(n / 6);
    chart = '<div class="fg-h">'+esc(t("fgTrend"))+'</div>'+
      '<svg class="fg-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t("fgTrend"))+'">'+
      [0,25,50,75,100].map(v => '<line class="g" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax" x="'+(L-6)+'" y="'+(y(v)+3.5)+'" text-anchor="end">'+v+'</text>').join("")+
      dates.map((d, i) => (i % step === 0 || i === n - 1) ? '<text class="ax" x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+short(d)+'</text>' : "").join("")+
      line("s", "ls")+line("c", "lc")+'</svg>'+
      '<div class="fg-leg"><span><i class="ls"></i>'+esc(t("fgStocks"))+'</span><span><i class="lc"></i>'+esc(t("fgCrypto"))+'</span></div>'+
      '<table class="fg-tab"><thead><tr><th>'+esc(t("fgDay"))+'</th><th>'+esc(t("fgStocks"))+'</th><th>'+esc(t("fgCrypto"))+'</th></tr></thead><tbody>'+
      dates.slice().reverse().slice(0, 7).map(d => { const f = fgOf(d); const c = v => v === null ? '<td>–</td>' : '<td><b style="color:'+fgColor(v)+'">'+v+'</b> <span>'+esc(fgWord(v))+'</span></td>';
        return '<tr'+(d === date ? ' class="cur"' : '')+'><td>'+esc(short(d))+'</td>'+c(f.s)+c(f.c)+'</tr>'; }).join("")+'</tbody></table>';
  }
  return '<section class="section" id="sec-fg"><h2 class="sh">'+esc(t("fgTitle"))+'</h2><p class="fx-sub">'+esc(t("fgSub"))+'</p><div class="panel fg">'+
    row(t("fgStocks"), t("fgStocksSrc"), cur.s)+row(t("fgCrypto"), t("fgCryptoSrc"), cur.c)+chart+
    '<div class="panel-note">'+esc(t("fgNote"))+' <a href="https://edition.cnn.com/markets/fear-and-greed" target="_blank" rel="noopener">CNN</a> · <a href="https://alternative.me/crypto/fear-and-greed-index/" target="_blank" rel="noopener">Alternative.me</a></div></div></section>';
}

function refreshThemed(){ const y = window.scrollY; paintLegend(); if (S.current && S.editions[S.current]) renderDay(); window.scrollTo(0, y); if ($("#menuOv").classList.contains("show")) buildMenu(); }
function switchTheme(pref, from){
  if (!window.AZ_THEME || window.AZ_THEME.pref === pref) return;
  const was = document.documentElement.getAttribute("data-theme");
  const change = () => { window.AZ_THEME.set(pref); refreshThemed(); };
  const willBe = pref === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : pref;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (willBe === was || reduce) { change(); return; }
  if (document.startViewTransition) {
    const r = from ? from.getBoundingClientRect() : {left: innerWidth / 2, top: 0, width: 0, height: 0};
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    document.documentElement.classList.add("vt-theme");
    const vt = document.startViewTransition(change);
    vt.ready.then(() => {
      document.documentElement.animate({ clipPath: ["circle(0px at "+x+"px "+y+"px)", "circle("+rad+"px at "+x+"px "+y+"px)"] },
        { duration: 620, easing: "cubic-bezier(.22,1,.36,1)", pseudoElement: "::view-transition-new(root)" });
    }).catch(() => {});
    vt.finished.finally(() => document.documentElement.classList.remove("vt-theme"));
  } else {
    const r = document.documentElement; r.classList.add("theme-fade");
    change(); setTimeout(() => r.classList.remove("theme-fade"), 520);
  }
}
if (window.AZ_THEME) window.AZ_THEME.onSystemChange = refreshThemed;

function closeMenu(then){
  const o = $("#menuOv"); if (!o.classList.contains("show")) { if (then) then(); return; }

$("#menuOv").addEventListener("click", e => {
  if (e.target.id === "menuOv") { closeMenu(); return; }
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.thset) { switchTheme(b.dataset.thset, b); return; }
  if (b.dataset.msec) { closeMenu(() => goSection(b.dataset.msec)); return; }
  if (b.dataset.mfil) { const f = b.dataset.mfil; closeMenu(() => { setFilter(f); setTimeout(() => goSection("sec-stories"), 60); }); return; }

(function(){ /* glisare spre stânga pentru închidere */
  const d = $("#drawer"); let x0 = null, y0 = 0, dx = 0, drag = false;
  d.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; drag = false; }, {passive:true});
  d.addEventListener("touchmove", e => { if (x0 === null) return; dx = e.touches[0].clientX - x0; const dy = e.touches[0].clientY - y0;
    if (!drag && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.4) { drag = true; d.style.transition = "none"; }
    if (drag) d.style.transform = "translate3d("+Math.min(0, dx)+"px,0,0)"; }, {passive:true});
  d.addEventListener("touchend", () => { if (drag) { d.style.transition = ""; if (dx < -70) closeMenu(); else d.style.transform = ""; } x0 = null; drag = false; });
})();

/* ---------- interacțiuni ---------- */
function jumpTo(n, smooth){
  if (S.filter !== "all") { S.filter = "all"; renderDay(); }
  const c = document.getElementById("st-"+n); if (!c) return;
  c.classList.add("open"); c.querySelector('[data-act="toggle"]')?.setAttribute("aria-expanded","true");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const y = c.getBoundingClientRect().top + window.scrollY - 72;
  try { window.scrollTo({top: y, behavior: smooth && !reduce ? "smooth" : "auto"}); } catch(e) { window.scrollTo(0, y); }
  c.classList.remove("flash"); void c.offsetWidth; c.classList.add("flash");
  setTimeout(() => { const top = c.getBoundingClientRect().top; if (top < 0 || top > 200) c.scrollIntoView({block:"start"}); }, smooth ? 900 : 60);
}
$("#main").addEventListener("click", async e => {
  const sb = e.target.closest("[data-sec]"); if (sb) { goSection(sb.dataset.sec); return; }
  const f = e.target.closest("[data-filter]"); if (f) { setFilter(f.dataset.filter); return; }
  const j = e.target.closest("[data-jump]");
  if (j) { jumpTo(j.dataset.jump, true); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  if (a.dataset.act === "recheck") { refreshDays(true); return; }
  const card = a.closest(".card"), n = Number(card.dataset.n);
  if (a.dataset.act === "toggle") {
    card.classList.remove("static");
    clearTimeout(card._closeT);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (card.classList.contains("closing")) { card.classList.remove("closing"); a.setAttribute("aria-expanded", "true"); return; }
    if (!card.classList.contains("open")) { void card.offsetWidth; card.classList.add("open"); a.setAttribute("aria-expanded", "true"); return; }
    a.setAttribute("aria-expanded", "false");
    if (reduce) { card.classList.remove("open"); return; }
    const items = card.querySelectorAll(".dz .cas"), n = Math.min(items.length - 1, 14);
    card.querySelector(".dz").style.setProperty("--n", Math.max(0, n));
    card.classList.add("closing");
    const total = Math.max(0, n) * 20 + 240;
    card._closeT = setTimeout(() => { card.classList.remove("open"); card._closeT = setTimeout(() => card.classList.remove("closing"), 520); }, Math.round(total * 0.6));
  }
  if (a.dataset.act === "save" && S.uid) {
    const key = storyKey(S.current, n), s = arr(S.editions[S.current].stories).find(x => x.n === n);
    a.disabled = true;
    try {
      const ref = S.db.collection("data/users/"+S.uid).doc(key);
      if (S.saved[key]) await ref.delete(); else await ref.set({kind:"saved", date:S.current, n, title:s?.title||"", impact:s?.impact||1});
    } catch(err) { a.title = t("saveFail"); }
    a.disabled = false;
  }
});
function step(dir){ const k = sortedDays(), i = k.indexOf(S.current); const n = k[i+dir]; if (n) { openDay(n); window.scrollTo(0,0); } }
$("#prevBtn").onclick = () => step(-1);
$("#nextBtn").onclick = () => step(1);
window.addEventListener("hashchange", () => { const m = location.hash.match(/^#d-(\d{4}-\d{2}-\d{2})$/); if (m && S.days[m[1]] && m[1] !== S.current) openDay(m[1], false); });

/* calendar */
function renderCal(){
  /* ultimele 7 zile până azi, plus ziua de mâine, încă incertă */
  $("#calTitle").textContent = t("last7");
  const tIso = todayIso(), today = parseDate(tIso);
  const dayAt = off => { const d = new Date(today); d.setDate(d.getDate() + off); return d; };
  let h = "";
  for (let off = 1; off >= -6; off--) {
    const d = dayAt(off), k = iso(d), info = S.days[k];
    const rel = off === 0 ? t("calToday") : off === -1 ? t("calYesterday") : "";
    const wd = fmt(d, {weekday:"short"}).replace(".", "");
    const dm = fmt(d, {day:"numeric", month:"short"}).replace(".", "");
    const datePart = '<span class="cd-date"><b>'+d.getDate()+'</b><small>'+esc(wd)+'</small></span>';
    if (off === 1) {
      h += '<div class="cd future" aria-label="'+esc(t("nextEd")+", "+dm)+'">'+datePart+'<span class="cd-body"><span class="cd-top">'+esc(t("nextEd"))+'</span><span class="cd-title">'+esc(t("nextEdWhen"))+'</span></span><span class="cd-score">?</span></div>';
      continue;
    }
    if (!info) {
      h += '<div class="cd empty" aria-label="'+esc(dm+", "+t("noEd"))+'">'+datePart+'<span class="cd-body"><span class="cd-top">'+esc(rel || dm)+'</span><span class="cd-title">'+esc(t("noEd"))+'</span></span><span class="cd-score">–</span></div>';
      continue;
    }
    const v = dayImpact(k) || null, col = v ? impactColor(v) : "var(--muted)";
    const head = (LANG === "en" ? (info.headline_en || info.headline) : (info.headline || info.headline_en)) || "";
    const cls = ["cd"]; if (k === S.current) cls.push("sel");
    h += '<button type="button" class="'+cls.join(" ")+'" data-day="'+k+'" style="--c:'+col+'" aria-label="'+esc(dm+(v ? ", "+t("impactOf")+" "+impactWord(v)+" "+v+"/10" : "")+(head ? ". "+head : ""))+'"'+(k === S.current ? ' aria-current="date"' : '')+'>'+
      datePart+'<span class="cd-body"><span class="cd-top">'+esc(rel ? rel+" · "+dm : dm)+(v ? ' · '+esc(impactWord(v)) : '')+'</span><span class="cd-title">'+esc(head)+'</span></span>'+
      '<span class="cd-score">'+(v ? esc(String(v)) : '')+'</span></button>';
  }
  $("#cal").innerHTML = h;
}

  handles.forEach(hd => {
    hd.addEventListener("pointerdown", e => { if (e.pointerType === "mouse" || e.target.closest("button")) return; y0 = e.clientY; dy = 0; sh.classList.add("dragging"); try { hd.setPointerCapture(e.pointerId); } catch(_) {} });
    hd.addEventListener("pointermove", e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = "translateY(" + dy + "px)"; });
    const end = () => { if (y0 === null) return; sh.classList.remove("dragging"); if (dy > 90) { closeOv("#" + o.id); } sh.style.transform = ""; y0 = null; dy = 0; };
    hd.addEventListener("pointerup", end); hd.addEventListener("pointercancel", end);
  });
});
$("#dateBtn").onclick = () => { S.calMonth = parseDate(S.current || todayIso()); renderCal(); openOv("#calOv"); };
$("#calClose").onclick = () => closeOv("#calOv");
$("#cal").addEventListener("click", e => { const b = e.target.closest("[data-day]"); if (!b || b.disabled) return; closeOv("#calOv"); openDay(b.dataset.day); window.scrollTo(0,0); });
document.querySelectorAll(".overlay").forEach(o => o.addEventListener("click", e => { if (e.target === o) closeOv("#" + o.id); }));
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".overlay.show").forEach(o => closeOv("#" + o.id)); });

/* căutare */
async function loadAll(){
  if (S.allLoaded) return;
  await Promise.all(sortedDays().map(d => loadEdition(d).catch(() => null)));
  S.allLoaded = true;
}
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
let qTimer = null;
async function runSearch(){
  const q = norm($("#q").value.trim()), out = $("#results");
  if (q.length < 2) { renderSavedList(); return; }
  if (!S.allLoaded) { out.innerHTML = '<li class="strip-note">'+esc(t("searching"))+'</li>'; try { await loadAll(); } catch(e) { out.innerHTML = '<li class="strip-note">'+esc(t("archiveFailShort"))+'</li>'; return; } }
  const hits = [];
  Object.keys(S.editions).sort().reverse().forEach(date => arr(S.editions[date].stories).forEach(s => {
    const hay = norm([s.title, s.essential, s.region, ...arr(s.happened), ...arr(s.context), ...arr(s.countries).map(countryName)].join(" "));
    if (hay.includes(q)) hits.push({date, s});
  }));
  out.innerHTML = hits.length ? hits.slice(0, 60).map(({date, s}) => '<li><button data-go="'+date+'" data-n="'+esc(s.n)+'">'+dotHtml(s.impact)+'<span>'+esc(s.title)+'<small>'+esc(longDate(date))+' · '+esc(s.category)+'</small></span></button></li>').join("") : '<li class="strip-note">'+esc(t("noResults"))+'</li>';
}
function renderSavedList(){
  const out = $("#results"), items = Object.values(S.saved).filter(x => x && x.date).sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (a.n||0) - (b.n||0));
  if (!S.uid) { out.innerHTML = ""; return; }
  out.innerHTML = items.length ? '<li class="eyebrow" style="padding:8px 8px 4px">'+esc(t("savedStories"))+'</li>' + items.map(x => '<li><button data-go="'+esc(x.date)+'" data-n="'+esc(x.n)+'">'+dotHtml(x.impact)+'<span>'+esc(x.title)+'<small>'+esc(longDate(x.date))+'</small></span></button></li>').join("")
    : '<li class="strip-note" style="padding:8px">'+esc(t("noSaved"))+'</li>';
}
$("#searchBtn").onclick = () => { openOv("#searchOv"); runSearch(); setTimeout(() => $("#q").focus(), 50); };
$("#searchClose").onclick = () => closeOv("#searchOv");
$("#q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(runSearch, 200); });
$("#results").addEventListener("click", async e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  closeOv("#searchOv"); S.filter = "all";
  await openDay(b.dataset.go);
  const c = document.getElementById("st-"+b.dataset.n);
  if (c) jumpTo(b.dataset.n, false);
});

/* titlul din antet: derulare animată până sus */
let scrollAnim = null;
function animateScroll(target, done){
  const start = window.scrollY || document.documentElement.scrollTop;
  const max = Math.max(0, document.documentElement.scrollHeight - innerHeight);
  const to = Math.max(0, Math.min(max, Math.round(target))), dist = to - start;
  if (scrollAnim) cancelAnimationFrame(scrollAnim);
  if (Math.abs(dist) < 2) { done && done(); return; }
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { window.scrollTo(0, to); done && done(); return; }
  const dur = Math.min(1100, 450 + Math.abs(dist) * 0.12), t0 = performance.now();
  const ease = x => 1 - Math.pow(1 - x, 4);
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    window.scrollTo(0, Math.round(start + dist * ease(p)));
    if (p < 1) scrollAnim = requestAnimationFrame(step); else { scrollAnim = null; done && done(); }
  };
  scrollAnim = requestAnimationFrame(step);
}
function scrollToTop(){
  const b = $("#brandBtn"); b.classList.add("spin"); setTimeout(() => b.classList.remove("spin"), 700);
  animateScroll(0);
}
function goSection(id){
  const el = document.getElementById(id); if (!el) return;
  const head = document.querySelector("header.top");
  const off = (head ? head.getBoundingClientRect().height : 60) + 12;
  const y = el.getBoundingClientRect().top + (window.scrollY || 0) - off;
  animateScroll(y, () => {
    const target = el.querySelector(".panel, .fx-list") || el;
    target.classList.remove("sec-flash"); void target.offsetWidth; target.classList.add("sec-flash");
  });
}
$("#brandBtn").onclick = scrollToTop;
["wheel","touchstart","keydown"].forEach(ev => window.addEventListener(ev, () => { if (scrollAnim) { cancelAnimationFrame(scrollAnim); scrollAnim = null; } }, {passive:true}));

/* comutator de limbă */
function setLang(l){
  if (!LANGS.includes(l) || l === LANG) { closeOv("#langOv"); return; }
  LANG = l;
  try { localStorage.setItem("az-lang", l); } catch(e) {}
  applyStatic();
  S.editions = {}; S.allLoaded = false;
  closeOv("#langOv");
  if (S.current) openDay(S.current, false); else renderEmpty();
  updateHeader();
  if ($("#q").value.trim()) runSearch();
}
$("#langBtn").onclick = () => openOv("#langOv");
$("#langClose").onclick = () => closeOv("#langOv");
document.querySelectorAll(".lang-opt[data-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

boot();
